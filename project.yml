name: RemoteApp
options:
  bundleIdPrefix: io.github.dabbers.remoteapps
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Ad-hoc signing so the project builds without an Apple Developer account.
    # To use a real identity, set DEVELOPMENT_TEAM and CODE_SIGN_STYLE: Automatic
    # (a stable identity keeps Screen Recording / Accessibility grants across rebuilds).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  RemoteAppProtocol:
    path: RemoteAppProtocol
targets:
  RemoteAppServer:
    type: application
    platform: macOS
    sources:
      - path: Server/Sources
      - path: Server/Resources
        buildPhase: resources
    dependencies:
      - package: RemoteAppProtocol
    entitlements:
      path: Server/RemoteAppServer.entitlements
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Server/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dabbers.remoteapps.server
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  RemoteAppClient:
    type: application
    platform: iOS
    sources:
      - path: Client/Sources
    dependencies:
      - package: RemoteAppProtocol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Client/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dabbers.remoteapps.client
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
