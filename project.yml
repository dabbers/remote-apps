name: RemoteApp
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
# Signing and the bundle-id prefix come from Config/Base.xcconfig, which pulls in
# a gitignored Config/Local.xcconfig for per-machine overrides (see
# Config/Local.xcconfig.example). Nothing machine-specific lives in this file.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  RemoteAppProtocol:
    path: RemoteAppProtocol
targets:
  RemoteAppServer:
    type: application
    platform: macOS
    sources:
      - path: Server/Sources
    dependencies:
      - package: RemoteAppProtocol
    entitlements:
      path: Server/RemoteAppServer.entitlements
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Server/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(REMOTEAPP_BUNDLE_PREFIX).server
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  RemoteAppClient:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: Client/Sources
    dependencies:
      - package: RemoteAppProtocol
    entitlements:
      path: Client/RemoteAppClient.entitlements
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Client/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(REMOTEAPP_BUNDLE_PREFIX).client
        # iPhone + iPad; Mac Catalyst builds a native-feeling Mac app.
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
